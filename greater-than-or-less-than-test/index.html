<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greater Than or Less Than Test</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <button id="nextPattern" type="button">Next pattern</button>

      <div class="pattern" aria-label="Comparison pattern">
        <span id="numberOne"></span>
        <span>is</span>
        <fieldset class="choices">
          <legend class="visually-hidden">Choose a comparison</legend>
          <button type="button" data-comparison="greater-than">greater than</button>
          <button type="button" data-comparison="less-than">less than</button>
          <button type="button" data-comparison="equal-to">equal to</button>
        </fieldset>
        <span id="numberTwo"></span>
      </div>

      <p id="feedback" aria-live="polite"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
